<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open transit tracker</title>
<meta name="description" content="Open transit fleet coverage tracker.">
<style>
  :root {
    --bg: #09090b; --card: #18181b; --border: #27272a;
    --text: #f4f4f5; --muted: #a1a1aa; --faint: #52525b;
    --green: #10b981; --green-hover: #34d399; --cell: #27272a; --cell-text: #71717a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 72rem; width: 100%; margin: 0 auto; }
  @media (max-width: 420px) {
    body { padding: 1.25rem 0.6rem 3rem; }
    .sub { margin-bottom: 1.5rem; }
    .agency { margin-bottom: 2.25rem; }
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 2.5rem; }
  .agency { margin-bottom: 3rem; }
  .agency-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.75rem; margin-bottom: 0.75rem; }
  .agency-head h2 { font-size: 1.15rem; margin: 0; }
  .pct { color: var(--green); font-weight: 700; font-size: 1.05rem; }
  .count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .track { height: 10px; border-radius: 5px; background: var(--cell); overflow: hidden; margin-bottom: 1.25rem; }
  .fill { height: 100%; background: var(--green); border-radius: 5px; }
  .range { margin-bottom: 1.5rem; }
  .range-head { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; }
  .range-head h3 { font-size: 0.85rem; margin: 0; color: var(--text); font-weight: 600; }
  .range-head h3 small { color: var(--faint); font-weight: 400; margin-left: 0.4rem; }
  .range-head span { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .grid { display: flex; flex-wrap: wrap; gap: 3px; }
  .prefix-note { color: var(--faint); font-size: 0.8rem; margin-top: 0.25rem; }
  .cell {
    width: 44px; height: 26px; border-radius: 4px;
    background: var(--cell); color: var(--cell-text);
    font: 11px/26px ui-monospace, "SF Mono", Menlo, monospace;
    text-align: center; user-select: none;
  }
  .cell.ridden { background: var(--green); color: #022c22; font-weight: 600; cursor: pointer; }
  .cell.ridden:hover { background: var(--green-hover); }
  /* ride tooltip: date always, delete button only on writable copies */
  .tip { position: fixed; z-index: 10; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.8rem;
    font-size: 0.85rem; box-shadow: 0 6px 24px rgba(0,0,0,.5); max-width: 16rem; }
  .tip .tip-agency { color: var(--muted); }
  .tip .tip-date { color: var(--muted); display: block; margin: 0.15rem 0 0.45rem; }
  .tip button { background: #e05565; color: #fff; border: 0; border-radius: 6px;
    padding: 0.35rem 0.7rem; cursor: pointer; font: inherit; }
  .tip button:hover { background: #f06a6d; }
  footer { color: var(--faint); font-size: 0.8rem; margin-top: 3rem; }
  footer a { color: var(--muted); }
  /* record bar: only injected when /api/config says this copy is writable */
  .record { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
    margin: 0 0 2rem; padding: 0.9rem 1rem; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; }
  .record select, .record input {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.45rem 0.6rem; font: inherit; }
  .record input { width: 9rem; }
  .record button { background: var(--green); color: #022c22; font-weight: 600;
    border: 0; border-radius: 6px; padding: 0.5rem 0.9rem; cursor: pointer; }
  .record button:hover { background: var(--green-hover); }
  .record .msg { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>🚍 open transit tracker</h1>
  <p class="sub" id="updated" hidden></p>
  <div id="app"><p class="sub">loading…</p></div>
  <footer>data auto-updates daily · <a href="https://github.com/wokhouse/open-transit-tracker">source</a></footer>
</main>
<script>
const num = v => {
  const m = String(v).match(/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
};
let WRITABLE = false;   // true only on the local server copy (/api/config)
let lastData = null;
let tipEl = null;

function closeTip() { if (tipEl) { tipEl.remove(); tipEl = null; } }
document.addEventListener("click", e => {
  if (tipEl && !tipEl.contains(e.target) && !e.target.classList.contains("ridden")) closeTip();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTip(); });

function showTip(cell, agency, ride) {
  closeTip();
  tipEl = document.createElement("div");
  tipEl.className = "tip";
  tipEl.innerHTML =
    `<strong>${ride.vehicle}</strong> <span class="tip-agency">${agency.name}</span>` +
    `<span class="tip-date">ridden ${ride.date || "unknown date"}</span>`;
  if (WRITABLE) {
    const del = document.createElement("button");
    del.textContent = "delete ride";
    del.onclick = async () => {
      const r = await fetch(`api/ride?agency=${encodeURIComponent(agency.slug)}` +
        `&vehicle=${encodeURIComponent(ride.vehicle)}`, {method: "DELETE"});
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) {
        const msg = document.createElement("span");
        msg.className = "tip-date";
        msg.textContent = j.error || "delete failed";
        tipEl.appendChild(msg);
        return;
      }
      closeTip();
      fetch("data.json", {cache: "no-store"}).then(x => x.json()).then(render);
    };
    tipEl.appendChild(del);
  }
  document.body.appendChild(tipEl);
  const rect = cell.getBoundingClientRect();
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = rect.left + rect.width / 2 - tw / 2;
  let y = rect.bottom + 6;
  x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
  if (y + th > window.innerHeight - 8) y = rect.top - th - 6;
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
}
const rangeLabel = r => r.prefix != null ? r.prefix + "-series"
  : r.cars ? r.cars[0] + "\u2013" + r.cars[r.cars.length - 1] + " (irregular)"
  : r.lo === r.hi ? String(r.lo) : r.lo + "\u2013" + r.hi;

function render(data) {
  lastData = data;
  if (data.updated) {
    const sub = document.getElementById("updated");
    sub.textContent = "last updated " + data.updated;
    sub.hidden = false;
    const meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute("content",
      "Open transit fleet coverage tracker — last updated " + data.updated + ".");
  }
  const ridesByAgency = {};
  for (const ride of data.rides)
    (ridesByAgency[ride.agency_slug] ??= []).push(ride);
  const rangesByAgency = {};
  for (const rng of data.ranges)
    (rangesByAgency[rng.agency_slug] ??= []).push(rng);

  const app = document.getElementById("app");
  app.innerHTML = "";

  for (const a of data.agencies) {
    const rides = ridesByAgency[a.slug] || [];
    const riddenMap = new Map();
    for (const r of rides) {
      const n = num(r.vehicle);
      if (n !== null) riddenMap.set(n, r);
    }
    const pct = a.total_fleet ? rides.length / a.total_fleet * 100 : 0;
    a._pct = pct;
  }

  // biggest coverage first
  data.agencies.sort((x, y) => y._pct - x._pct);

  for (const a of data.agencies) {
    const rides = ridesByAgency[a.slug] || [];
    const riddenMap = new Map();
    for (const r of rides) {
      const n = num(r.vehicle);
      if (n !== null) riddenMap.set(n, r);
    }
    const pct = a._pct;

    const sec = document.createElement("section");
    sec.className = "agency";
    sec.innerHTML =
      `<div class="agency-head"><h2>${a.name}</h2>` +
      `<span class="pct">${pct.toFixed(2)}%</span>` +
      `<span class="count">${rides.length} / ${a.total_fleet}</span></div>` +
      `<div class="track"><div class="fill" style="width:${Math.min(pct, 100)}%"></div></div>`;

    for (const rng of rangesByAgency[a.slug] || []) {
      const cells = [];              // {label, num} — num used for ridden lookup
      if (rng.cars) {
        // explicit car list (irregular numbering, e.g. Caltrain KISS coaches)
        for (const c of rng.cars) cells.push({ label: c, num: num(c) });
      } else if (rng.lo !== null && rng.hi !== null) {
        for (let n = rng.lo; n <= rng.hi; n++) cells.push({ label: n, num: n });
      }
      const riddenIn = cells.filter(c => c.num != null && riddenMap.has(c.num)).length;
      const denom = rng.count ?? cells.length;

      const rsec = document.createElement("div");
      rsec.className = "range";
      let head =
        `<div class="range-head"><h3>${rng.type}<small>${rangeLabel(rng)}</small></h3>` +
        `<span>${riddenIn}/${denom}</span></div>`;
      if (!cells.length) {
        // no drawable cells: show a summary row
        rsec.innerHTML = head + `<div class="prefix-note">${riddenIn} of ${denom} ridden</div>`;
        sec.appendChild(rsec);
        continue;
      }
      rsec.innerHTML = head + `<div class="grid"></div>`;
      const grid = rsec.querySelector(".grid");
      for (const { label, num: n } of cells) {
        const cell = document.createElement("span");
        const ride = n != null ? riddenMap.get(n) : null;
        cell.className = "cell" + (ride ? " ridden" : "");
        cell.textContent = label;
        if (ride) {
          cell.title = `${ride.vehicle} — ridden ${ride.date || "unknown date"}`;
          cell.onclick = e => { e.stopPropagation(); showTip(cell, a, ride); };
        }
        grid.appendChild(cell);
      }
      sec.appendChild(rsec);
    }
    app.appendChild(sec);
  }
}

function mountRecordBar(cfg) {
  WRITABLE = true;
  const bar = document.createElement("div");
  bar.className = "record";
  const opts = cfg.agencies.map(a =>
    `<option value="${a.slug}">${a.name} (${a.ridden}/${a.total_fleet})</option>`).join("");
  bar.innerHTML =
    `<input id="rec-vehicle" placeholder="vehicle #" autocomplete="off">` +
    `<select id="rec-agency">${opts}</select>` +
    `<button id="rec-go">record ride</button>` +
    `<span class="msg" id="rec-msg"></span>`;
  const app = document.getElementById("app");
  app.parentNode.insertBefore(bar, app);
  document.getElementById("rec-go").onclick = async () => {
    const agency_slug = document.getElementById("rec-agency").value;
    const vehicle = document.getElementById("rec-vehicle").value.trim();
    const msg = document.getElementById("rec-msg");
    if (!vehicle) { msg.textContent = "enter a vehicle number"; return; }
    const r = await fetch("api/ride", {method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({agency_slug, vehicle})});
    const j = await r.json();
    if (!r.ok || !j.ok) { msg.textContent = j.error || "failed"; return; }
    msg.textContent = j.new
      ? `added ${j.vehicle} on ${j.date} — ${j.count}/${j.total} (${j.pct}%)`
      : `${j.vehicle} already ridden`;
    document.getElementById("rec-vehicle").value = "";
    fetch("data.json", {cache: "no-store"}).then(x => x.json())
      .then(render);
  };
}

fetch("data.json").then(r => r.json()).then(render).catch(err => {
  document.getElementById("app").innerHTML = `<p class="sub">failed to load data.json: ${err}</p>`;
});
// Writable copies (the local server) expose /api/config. GitHub Pages
// 404s it, so the same page stays read-only there.
fetch("api/config", {cache: "no-store"}).then(r => r.ok ? r.json() : null)
  .then(cfg => { if (cfg && cfg.writable) mountRecordBar(cfg); })
  .catch(() => {});

</script>
</body>
</html>
