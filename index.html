<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open transit tracker</title>
<meta name="description" content="Open transit fleet coverage tracker.">
<style>
  /* The page is a desk. The report itself is one dot-printer sheet,
     rendered by scripts/dotprinter.py: the live copy fetches it from
     /api/sheet.svg, the static GitHub Pages copy fetches sheet.svg.
     This file only draws the interactive chrome over the sheet:
     the add-vehicle form and the ride tooltip. */
  :root {
    --desk: #23262b;
    --paper: #f6f3e8;
    --ink: #26251f;
    --ink-faint: #b3ad9c;
    --ink-mid: #6f6a5c;
    --red: #b3382b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1rem 4rem;
    background: radial-gradient(1200px 700px at 50% -10%, #31353c, var(--desk) 70%);
    color: var(--ink);
    font: 13px/21px var(--mono);
  }
  main { max-width: 1080px; width: 100%; margin: 0 auto; }
  #sheet { position: relative; }
  #sheet svg { display: block; width: 100%; height: auto; }
  #sheet .loading { color: var(--ink-faint); text-align: center; padding: 3rem 0; }
  @media (max-width: 640px) {
    body { padding: 1rem .4rem 3rem; }
  }

  /* record bar: overlaid on the blank rows the sheet reserves for it
     (the <rect id="form-gap"> marker). Only on writable copies. */
  .record {
    position: absolute; display: none;
    padding: 0; margin: 0;
  }
  .record .rec-label { color: var(--ink); font-weight: 700;
    text-transform: uppercase; line-height: 21px; }
  .record .rec-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .record select, .record input {
    background: var(--paper); color: var(--ink); border: 1px solid var(--ink-mid);
    font: inherit; line-height: 19px; padding: 0 .6rem; }
  .record select { height: 21px; box-sizing: border-box; }
  .record input { width: 9rem; }
  .record button { background: var(--ink); color: var(--paper); font-weight: 700;
    border: 1px solid var(--ink); font: inherit; padding: 0 .9rem; line-height: 19px;
    cursor: pointer; text-transform: uppercase; }
  /* below this width one control per line: each control is exactly one
     21px grid row (19px line-box + 2px border), so the stacked form
     stays on the green line grid instead of wrapping at 8px gaps */
  @media (max-width: 560px) {
    .record .rec-row { flex-direction: column; flex-wrap: nowrap; gap: 0;
      align-items: stretch; }
    .record select, .record input, .record button { width: 100%;
      box-sizing: border-box; }
    /* one blank grid row between fields/buttons: 21px margins, not flex
       gap, so the empty msg span never adds a phantom row */
    .record select, .record button { margin-top: 21px; }
  }
  .record .msg:empty { display: none; }
  .record button:hover { background: #000; }
  .record .msg { color: var(--ink-mid); }

  /* tooltip: a torn-off slip */
  .tip { position: fixed; z-index: 10; background: var(--paper); color: var(--ink);
    border: 1px dashed var(--ink-mid); padding: .6rem .8rem;
    font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.4); max-width: 16rem; }
  .tip .tip-agency { color: var(--ink-mid); }
  .tip .tip-date { color: var(--ink-mid); display: block; margin: .15rem 0 .45rem; }
  .tip button { background: var(--red); color: var(--paper); border: 0;
    padding: .35rem .7rem; cursor: pointer; font: inherit; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <div id="sheet"><p class="loading">loading…</p></div>
</main>
<script>
const MOBILE_MQ = window.matchMedia("(max-width: 700px)");
let WRITABLE = false;   // true only on the local server copy (/api/config)
let tipEl = null;
let formEl = null;

function closeTip() { if (tipEl) { tipEl.remove(); tipEl = null; } }
document.addEventListener("click", e => {
  if (tipEl && !tipEl.contains(e.target) && !e.target.matches("[data-vehicle]")) closeTip();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeTip(); });

// tooltip over a ridden cell in the sheet (cells carry data-* attributes)
function showTip(cell) {
  closeTip();
  const vehicle = cell.dataset.vehicle;
  const date = cell.dataset.date;
  tipEl = document.createElement("div");
  tipEl.className = "tip";
  tipEl.innerHTML =
    `<strong>${vehicle}</strong> <span class="tip-agency">${cell.dataset.agencyName}</span>` +
    `<span class="tip-date">ridden ${date || "unknown date"}</span>`;
  if (WRITABLE) {
    const del = document.createElement("button");
    del.textContent = "delete ride";
    del.onclick = async () => {
      const r = await fetch(`api/ride?agency=${encodeURIComponent(cell.dataset.agency)}` +
        `&vehicle=${encodeURIComponent(vehicle)}`, {method: "DELETE"});
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) {
        const msg = document.createElement("span");
        msg.className = "tip-date";
        msg.textContent = j.error || "delete failed";
        tipEl.appendChild(msg);
        return;
      }
      closeTip();
      loadSheet();
    };
    tipEl.appendChild(del);
  }
  document.body.appendChild(tipEl);
  const rect = cell.getBoundingClientRect();
  const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = rect.left + rect.width / 2 - tw / 2;
  let y = rect.bottom + 6;
  x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
  if (y + th > window.innerHeight - 8) y = rect.top - th - 6;
  tipEl.style.left = x + "px";
  tipEl.style.top = y + "px";
}

function wireCells() {
  document.querySelectorAll("#sheet [data-vehicle]").forEach(el => {
    el.addEventListener("click", e => { e.stopPropagation(); showTip(el); });
  });
}

// place the HTML form inside the blank rows the sheet reserved for it
// (the <rect id="form-gap"> marker). The sheet width comes from the
// fetched SVG itself, so desktop and mobile sheets both place correctly.
function placeForm() {
  if (!formEl) return;
  const gap = document.querySelector("#sheet #form-gap");
  const svg = document.querySelector("#sheet svg");
  if (!gap || !svg) return;
  const sheetW = parseFloat(svg.getAttribute("width")) || 1080;
  const scale = svg.getBoundingClientRect().width / sheetW;
  formEl.style.transformOrigin = "0 0";
  formEl.style.transform = `scale(${scale})`;
  formEl.style.left = gap.getAttribute("x") * scale + "px";
  formEl.style.top = gap.getAttribute("y") * scale + "px";
  formEl.style.width = gap.getAttribute("width") + "px";
  formEl.style.display = "block";
}

async function loadSheet(retry) {
  // narrow viewports get a sheet rendered at their own width, not a
  // scaled-down desktop sheet: the type stays readable. The server
  // picks the mobile or desktop layout itself at its own breakpoint.
  let url;
  if (WRITABLE) {
    const w = retry || Math.max(320, Math.min(1080, document.documentElement.clientWidth - 28));
    url = `api/sheet.svg?width=${w}`;
  } else {
    url = MOBILE_MQ.matches ? "sheet-mobile.svg" : "sheet.svg";
  }
  const r = await fetch(url, WRITABLE ? {cache: "no-store"} : {});
  if (!r.ok) {
    document.getElementById("sheet").innerHTML =
      `<p class="loading">failed to load the sheet (${r.status})</p>`;
    return;
  }
  document.getElementById("sheet").innerHTML = await r.text();
  if (WRITABLE && !retry) {
    // scrollbar width can shift the box after load: correct once so the
    // sheet renders at scale 1
    const box = Math.round(document.getElementById("sheet").clientWidth);
    const svg = document.querySelector("#sheet svg");
    if (box && svg && Math.abs(box - +svg.getAttribute("width")) > 2) {
      loadSheet(box);
      return;
    }
  }
  if (formEl) document.getElementById("sheet").appendChild(formEl);
  wireCells();
  placeForm();
}

function mountRecordBar(cfg) {
  WRITABLE = true;
  formEl = document.createElement("div");
  formEl.className = "record";
  const opts = cfg.agencies.map(a =>
    `<option value="${a.slug}">${a.name} (${a.ridden}/${a.total_fleet})</option>`).join("");
  formEl.innerHTML =
    `<div class="rec-label">add vehicle</div>` +
    `<div class="rec-row">` +
    `<input id="rec-vehicle" placeholder="vehicle #" autocomplete="off">` +
    `<select id="rec-agency">${opts}</select>` +
    `<button id="rec-go">record ride</button>` +
    `<span class="msg" id="rec-msg"></span></div>`;
  document.getElementById("sheet").appendChild(formEl);
  document.getElementById("rec-go").onclick = async () => {
    const agency_slug = document.getElementById("rec-agency").value;
    const vehicle = document.getElementById("rec-vehicle").value.trim();
    const msg = document.getElementById("rec-msg");
    if (!vehicle) { msg.textContent = "enter a vehicle number"; return; }
    const r = await fetch("api/ride", {method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({agency_slug, vehicle})});
    const j = await r.json();
    if (!r.ok || !j.ok) { msg.textContent = j.error || "failed"; return; }
    msg.textContent = j.new
      ? `added ${j.vehicle} — ${j.count}/${j.total} (${j.pct}%)`
      : `${j.vehicle} already ridden`;
    document.getElementById("rec-vehicle").value = "";
    loadSheet();
  };
}

// Writable copies (the local server) expose /api/config and render the
// sheet live. GitHub Pages 404s /api/config, so that copy fetches the
// pre-built sheet.svg and stays read-only.
fetch("api/config", {cache: "no-store"}).then(r => r.ok ? r.json() : null)
  .then(cfg => {
    if (cfg && cfg.writable) { mountRecordBar(cfg); loadSheet(); }
    else loadSheet();
  })
  .catch(() => loadSheet());

window.addEventListener("resize", placeForm);
MOBILE_MQ.addEventListener("change", loadSheet);
// live mode: re-render the sheet when the viewport width changes enough
// to want a different layout (static Pages mode is covered by the MQ)
let reloadTimer = null, lastW = 0;
window.addEventListener("resize", () => {
  if (!WRITABLE) return;
  const w = Math.max(320, Math.min(1080, document.documentElement.clientWidth - 28));
  if (Math.abs(w - lastW) < 40) return;
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(() => { lastW = w; loadSheet(); }, 400);
});
</script>
</body>
</html>
